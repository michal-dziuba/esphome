switch:
  - platform: gpio
    id: cover_open_06_out11
    pin:
      mcp23xxx: pcf_right
      number: 5
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_06 [cover_open_06_out11, cover_close_06_out12]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_06_out12
    pin:
      mcp23xxx: pcf_right
      number: 4
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_06
    restore_mode: always off
