switch:
  - platform: gpio
    id: cover_open_12_out23
    pin:
      mcp23xxx: pcf_left
      number: 14
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_12 [cover_open_12_out23, cover_close_12_out24]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_12_out24
    pin:
      mcp23xxx: pcf_left
      number: 15
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_12
    restore_mode: always off
