switch:
  - platform: gpio
    id: cover_open_04_out07
    pin:
      mcp23xxx: pcf_left
      number: 9
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_04 [cover_open_04_out07, cover_close_04_out08]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_04_out08
    pin:
      mcp23xxx: pcf_left
      number: 8
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_04
    restore_mode: always off
