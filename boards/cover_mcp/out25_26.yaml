switch:
  - platform: gpio
    id: cover_open_13_out25
    pin:
      mcp23xxx: pcf_right
      number: 8
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_13 [cover_open_13_out25, cover_close_13_out26]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_13_out26
    pin:
      mcp23xxx: pcf_right
      number: 9
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_13
    restore_mode: always off
