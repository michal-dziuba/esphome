switch:
  - platform: gpio
    id: cover_open_03_out05
    pin:
      mcp23xxx: pcf_left
      number: 3
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_03 [cover_open_03_out05, cover_close_03_out06]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_03_out06
    pin:
      mcp23xxx: pcf_left
      number: 2
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_03
    restore_mode: always off
