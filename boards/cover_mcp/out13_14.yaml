switch:
  - platform: gpio
    id: cover_open_07_out13
    pin:
      mcp23xxx: pcf_right
      number: 3
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_07 [cover_open_07_out13, cover_close_07_out14]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_07_out14
    pin:
      mcp23xxx: pcf_right
      number: 2
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_07
    restore_mode: always off
