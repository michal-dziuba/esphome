switch:
  - platform: gpio
    id: cover_open_14_out27
    pin:
      mcp23xxx: pcf_right
      number: 10
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_14 [cover_open_14_out27, cover_close_14_out28]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_14_out28
    pin:
      mcp23xxx: pcf_right
      number: 11
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_14
    restore_mode: always off
