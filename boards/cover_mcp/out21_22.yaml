switch:
  - platform: gpio
    id: cover_open_11_out21
    pin:
      mcp23xxx: pcf_left
      number: 12
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_11 [cover_open_11_out21, cover_close_11_out22]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_11_out22
    pin:
      mcp23xxx: pcf_left
      number: 13
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_11
    restore_mode: always off
