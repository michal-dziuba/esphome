switch:
  - platform: gpio
    id: cover_open_08_out15
    pin:
      mcp23xxx: pcf_right
      number: 1
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_08 [cover_open_08_out15, cover_close_08_out16]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_08_out16
    pin:
      mcp23xxx: pcf_right
      number: 0
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_08
    restore_mode: always off
