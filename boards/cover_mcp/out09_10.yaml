switch:
  - platform: gpio
    id: cover_open_05_out09
    pin:
      mcp23xxx: pcf_right
      number: 7
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_05 [cover_open_05_out09, cover_close_05_out10]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_05_out10
    pin:
      mcp23xxx: pcf_right
      number: 6
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_05
    restore_mode: always off
