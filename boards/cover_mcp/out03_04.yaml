switch:
  - platform: gpio
    id: cover_open_02_out03
    pin:
      mcp23xxx: pcf_left
      number: 5
      mode:
        output: true
      inverted: true
    interlock: &cover_interlock_02 [cover_open_02_out03, cover_close_02_out04]
    interlock_wait_time: 5ms
    restore_mode: always off

  - platform: gpio
    id: cover_close_02_out04
    pin:
      mcp23xxx: pcf_left
      number: 4
      mode:
        output: true
      inverted: true
    interlock: *cover_interlock_02
    restore_mode: always off
